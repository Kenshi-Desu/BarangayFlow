<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resident Login | BarangayFlow</title>
  <link rel="stylesheet" href="/css/login.css">
  <link rel="icon" href="/images/BarangayFlow.Logo.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- Live animated orbs -->
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div id="particles"></div>

<div class="container">

  <div class="header">
    <a href="index.html" class="logo">
      <img src="/images/BarangayFlow.Logo.png" alt="Logo">
      <h2>BarangayFlow</h2>
    </a>
    <a href="index.html" class="back-btn">
      <img src="/images/icon4.png" alt="Back">
    </a>
  </div>

  <div class="login-box">
    <div class="login-icon"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
    <h1>Resident Login</h1>
    <p class="subtitle">Welcome back! Sign in to continue.</p>

    <div id="loginError" style="display:none; background:#fef2f2; color:#dc2626; border:1px solid #fecaca; border-radius:10px; padding:10px 14px; font-size:14px; margin-bottom:16px;"></div>

    <form onsubmit="login(event)">
      <label>Email Address</label>
      <div class="input-wrap">
        <span class="input-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span>
        <input id="login-email" type="email" placeholder="juan.delacruz@gmail.com" required autocomplete="email">
      </div>

      <label>Password</label>
      <div class="input-wrap">
        <span class="input-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
        <input id="login-password" type="password" placeholder="••••••••" required autocomplete="current-password" class="has-eye">
        <button type="button" class="eye-btn" onclick="togglePwd('login-password',this)" aria-label="Toggle password visibility">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <div class="options">
        <label><input type="checkbox"> Remember Me</label>
        <a href="#" id="forgotBtn">Forgot Password?</a>
      </div>

      <button id="loginBtn" type="submit">Login</button>
      <hr>
      <p>Don't have an account? <a href="register.html">Register Here</a></p>
    </form>
  </div>

</div>

<script>
  // Spawn floating particles
  const pContainer = document.getElementById('particles');
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 8 + 4;
    p.style.cssText = `
      width: ${size}px;
      height: ${size}px;
      left: ${Math.random() * 100}%;
      animation-duration: ${Math.random() * 14 + 10}s;
      animation-delay: ${Math.random() * 8}s;
      opacity: ${Math.random() * 0.12 + 0.04};
    `;
    pContainer.appendChild(p);
  }
</script>

<style>
  /* ── Eye-toggle button — mobile-safe tap target ── */
  .eye-btn {
    width: 44px !important;
    min-width: 44px !important;
    min-height: 44px !important;
    margin: 0 !important;
    padding: 0 !important;
    position: absolute !important;
    right: 2px !important;
    top: 50% !important;
    transform: translateY(-50%) !important;
    background: none !important;
    border: none !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    color: #9ca3af !important;
    cursor: pointer;
    transition: color 0.2s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    z-index: 2;
  }
  .eye-btn:hover { color: #4b5563 !important; background: none !important; transform: translateY(-50%) !important; }
  .eye-btn:active { color: #1f2937 !important; background: none !important; transform: translateY(-50%) !important; opacity: 1 !important; }
  input.has-eye { padding-right: 48px !important; }
  input[type="password"]::-ms-reveal,
  input[type="password"]::-ms-clear { display: none; }
  input[type="password"]::-webkit-credentials-auto-fill-button { display: none !important; }
</style>
<script>
  function togglePwd(id, btn) {
    const inp = document.getElementById(id);
    if (!inp) return;
    const isHidden = inp.type === 'password';
    inp.type = isHidden ? 'text' : 'password';
    const svg = btn.querySelector('svg');
    if (!svg) return;
    if (isHidden) {
      svg.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
    } else {
      svg.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }
  }
</script>
<script type="module" src="/js/auth.js"></script>
<script type="module">
  // Check maintenance mode on page load — if ON, show maintenance page instead
  import { db } from "/js/firebase.js";
  import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  onSnapshot(doc(db, "system", "config"), (snap) => {
    if (snap.exists() && snap.data()?.maintenance === true) {
      window.location.replace("maintenance.html");
    }
  });

  // Show disabled-account message if redirected from dashboard
  if (new URLSearchParams(window.location.search).get("disabled") === "1") {
    const el = document.getElementById("loginError");
    if (el) {
      el.textContent = "Your account has been disabled. Please contact the barangay office for assistance.";
      el.style.display = "block";
    }
  }
</script>
</body>
</html>
