<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reset Password — BarangayFlow</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:      #1a2cff;
      --primary-dark: #0f1fbf;
      --bg:           #f0f2ff;
      --card:         #ffffff;
      --text:         #1f2937;
      --muted:        #6b7280;
      --border:       #d1d5db;
      --danger:       #e53935;
      --success:      #16a34a;
    }

    body {
      font-family: 'DM Sans', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }

    /* ── Logo ── */
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .brand img { height: 36px; width: auto; }
    .brand h1  { font-size: 20px; font-weight: 700; color: var(--primary); }

    /* ── Card ── */
    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 32px 26px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(26,44,255,0.10);
    }

    .card h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .card p.sub { font-size: 14px; color: var(--muted); margin-bottom: 24px; }

    /* ── Form ── */
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }

    /* ── Password wrapper (for show/hide toggle) ── */
    .pw-wrap {
      position: relative;
      margin-bottom: 16px;
    }
    .pw-wrap input {
      width: 100%;
      height: 44px;
      padding: 0 44px 0 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
      color: var(--text);
      background: #fff;
      transition: border-color 0.18s;
      margin-bottom: 0;
    }
    .pw-wrap input:focus {
      outline: none;
      border-color: var(--primary);
    }
    .pw-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: var(--muted);
      display: flex;
      align-items: center;
      transition: color 0.18s;
    }
    .pw-toggle:hover { color: var(--primary); }

    /* ── Feedback messages ── */
    .msg {
      display: none;
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .msg.error   { background: #fff0f0; color: var(--danger); border-left: 3px solid var(--danger); }
    .msg.success { background: #f0fff4; color: var(--success); border-left: 3px solid var(--success); }
    .msg.show    { display: block; }

    /* ── Expired state ── */
    .expired-state {
      display: none;
      text-align: center;
      padding: 8px 0 4px;
    }
    .expired-state .icon { font-size: 40px; margin-bottom: 12px; }
    .expired-state h3    { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
    .expired-state p     { font-size: 14px; color: var(--muted); }

    /* ── Submit button ── */
    button[type="submit"] {
      width: 100%;
      height: 48px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.18s, opacity 0.18s;
      -webkit-tap-highlight-color: transparent;
      margin-top: 4px;
    }
    button[type="submit"]:hover   { background: var(--primary-dark); }
    button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
    }
    .back-link span { color: var(--primary); font-weight: 600; }

    /* ── Spinner ── */
    .spinner {
      display: none;
      width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="brand">
    <img src="/images/BarangayFlow.Logo.png" alt="BarangayFlow logo"
         onerror="this.style.display='none'">
    <h1>BarangayFlow</h1>
  </div>

  <div class="card">

    <!-- Valid code: show form -->
    <div id="formState">
      <h2>Set New Password</h2>
      <p class="sub">Choose a strong password for your account.</p>

      <div id="msg" class="msg"></div>

      <label for="np">New Password</label>
      <div class="pw-wrap">
        <input id="np" type="password" autocomplete="new-password"
               placeholder="At least 6 characters">
        <button type="button" class="pw-toggle" onclick="togglePw('np', this)" aria-label="Show password">
          <svg id="eye-np" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
          </svg>
        </button>
      </div>

      <label for="cp">Confirm Password</label>
      <div class="pw-wrap">
        <input id="cp" type="password" autocomplete="new-password"
               placeholder="Repeat new password">
        <button type="button" class="pw-toggle" onclick="togglePw('cp', this)" aria-label="Show password">
          <svg id="eye-cp" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
          </svg>
        </button>
      </div>

      <button type="submit" id="submitBtn" onclick="handleReset()">
        <span id="btnLabel">Update Password</span>
        <div class="spinner" id="spinner"></div>
      </button>
    </div>

    <!-- Invalid / expired code -->
    <div class="expired-state" id="expiredState">
      <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg></div>
      <h3>Link Expired or Invalid</h3>
      <p>This password reset link has already been used or has expired.<br>
         Please request a new one.</p>
    </div>

    <a href="/login.html" class="back-link"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px;"><polyline points="15 18 9 12 15 6"/></svg>Back to <span>Login</span></a>

  </div>

  <!-- Firebase v10 Modular SDK -->
  <script type="module">
    import { initializeApp }       from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth,
             verifyPasswordResetCode,
             confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey:            "AIzaSyDBCjZRktFMz_SqNSZ_KuLAl_eCwgKME9c",
      authDomain:        "barangayflow.web.app",        // ← fix: match your hosting domain
      projectId:         "barangayflow",
      storageBucket:     "barangayflow.firebasestorage.app",
      messagingSenderId: "212844211614",
      appId:             "1:212844211614:web:c15e372ebb71d3d2867a8f"
    };

    const auth = getAuth(initializeApp(firebaseConfig));

    // ── Extract oobCode + mode from URL ──
    // Firebase appends ?mode=resetPassword&oobCode=xxx&continueUrl=...
    // when Custom Action URL is set in Firebase Console.
    const params  = new URLSearchParams(window.location.search);
    const oobCode = params.get('oobCode');
    const mode    = params.get('mode');

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className   = `msg ${type} show`;
    }

    function setLoading(on) {
      document.getElementById('submitBtn').disabled = on;
      document.getElementById('btnLabel').style.display  = on ? 'none'  : 'block';
      document.getElementById('spinner').style.display   = on ? 'block' : 'none';
    }

    function showExpired() {
      document.getElementById('formState').style.display    = 'none';
      document.getElementById('expiredState').style.display = 'block';
    }

    // ── On load: validate that this is a password reset link ──
    const validModes = ['resetPassword', 'action'];
    if (!oobCode || !validModes.includes(mode)) {
      // Missing code or wrong mode (e.g. email verification link opened here)
      showExpired();
    } else {
      // Verify the code is still valid (not expired or already used)
      verifyPasswordResetCode(auth, oobCode).catch(showExpired);
    }

    // ── Submit handler ──
    window.handleReset = async function () {
      const newPass  = document.getElementById('np').value;
      const confPass = document.getElementById('cp').value;

      if (newPass.length < 6)   return showMsg('Password must be at least 6 characters.', 'error');
      if (newPass !== confPass)  return showMsg('Passwords do not match.', 'error');

      setLoading(true);
      try {
        await confirmPasswordReset(auth, oobCode, newPass);
        document.getElementById('np').value = '';
        document.getElementById('cp').value = '';
        showMsg('Password updated! Redirecting to login…', 'success');
        setTimeout(() => { window.location.href = '/login.html'; }, 3000);
      } catch (err) {
        const map = {
          'auth/expired-action-code': 'This reset link has expired. Please request a new one.',
          'auth/invalid-action-code': 'Invalid reset link. It may have already been used.',
          'auth/weak-password':       'Password is too weak. Use at least 6 characters.',
          'auth/user-disabled':       'This account has been disabled.',
        };
        showMsg(map[err.code] || `Error: ${err.message}`, 'error');
        setLoading(false);
      }
    };
    // ── Show / Hide password toggle ──
    window.togglePw = function(inputId, btn) {
      const input = document.getElementById(inputId);
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      btn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
      // Swap icon: eye-off when visible, eye when hidden
      btn.querySelector('svg').innerHTML = isHidden
        ? `<path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.477 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>`
        : `<path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>`;
    };
  </script>

</body>
</html>
